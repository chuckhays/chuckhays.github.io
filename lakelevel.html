<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USGS Chart with Historical Comparisons</title>

    <!-- Reused only for its bundled Dygraph library and default chart styling -->
    <link rel="stylesheet" href="https://dashboard.waterdata.usgs.gov/api/gwis/2.1.1/gwis.min.css"/>
    <script src="https://dashboard.waterdata.usgs.gov/api/gwis/2.1.1/gwis.min.js"></script>

    <style>
        :root {
            --bg: #f4f6f7;
            --card-bg: #ffffff;
            --stat-bg: #f4f6f7;
            --text: #2c3e50;
            --heading: #1a5276;
            --border: #ebeeef;
            --shadow: rgba(0,0,0,0.08);
            --stat-label: #5d6d7e;
            --stat-value: #1a5276;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #12181d;
                --card-bg: #1c252c;
                --stat-bg: #222d35;
                --text: #dfe6ec;
                --heading: #7fb3e0;
                --border: #2e3944;
                --shadow: rgba(0,0,0,0.4);
                --stat-label: #93a4b3;
                --stat-value: #7fb3e0;
            }
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
        }
        .container {
            max-width: 950px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px var(--shadow);
        }
        h2 {
            margin-top: 0;
            color: var(--heading);
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }
        #usgsChart {
            width: 100%;
            height: 480px;
            margin-top: 20px;
        }
        .stats-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .stat-card {
            flex: 1;
            min-width: 150px;
            background: var(--stat-bg);
            border-radius: 8px;
            padding: 15px 20px;
            text-align: center;
        }
        .stat-card .stat-label {
            font-size: 0.85em;
            color: var(--stat-label);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .stat-card .stat-value {
            font-size: 1.8em;
            font-weight: 600;
            color: var(--stat-value);
            margin: 4px 0;
        }
        /* gwis.min.css hardcodes light-theme colors for these dygraph elements */
        .gwis div.dygraph-title,
        .gwis div.dygraph-xlabel,
        .gwis div.dygraph-ylabel,
        .gwis div.dygraph-axis-label-x,
        .gwis div.dygraph-axis-label-y,
        .gwis div.dygraph-legend {
            color: var(--text) !important;
            background-color: transparent !important;
        }
        /* Rendered via Dygraph's labelsDiv option so the legend flows in normal
           layout and wraps, instead of the default absolutely-positioned overlay
           that runs off the right edge once series labels get long. */
        .chart-legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 4px 16px;
            padding: 8px 0 0;
            font-size: 0.85em;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="stats-row" id="usgsStats">
        <div class="stat-card" data-stat="current">
            <div class="stat-label">Current Live Data</div>
            <div class="stat-value">&hellip;</div>
        </div>
        <div class="stat-card" data-stat="lastYear">
            <div class="stat-label">Last Year Data</div>
            <div class="stat-value">&hellip;</div>
        </div>
        <div class="stat-card" data-stat="median">
            <div class="stat-label">Historical Median</div>
            <div class="stat-value">&hellip;</div>
        </div>
    </div>
    <div class="gwis">
        <div id="usgsChart"></div>
        <div id="chartLegend" class="chart-legend"></div>
    </div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', async () => {
        const SITE_NUMBER = '05289000';
        const PARAMETER_CODE = '00065';
        const DAYS = 30;
        const API_ROOT = 'https://api.waterdata.usgs.gov';

        const iso = (d) => d.toISOString();

        // GWIS (dashboard.waterdata.usgs.gov) only fetches raw iv/dv series and has no
        // concept of a prior-year overlay or a historical-median statistic. This chart
        // instead calls the newer api.waterdata.usgs.gov service directly, which exposes
        // both, and uses the Dygraph library bundled inside gwis.min.js to render them.
        try {
            const now = new Date();
            const start = new Date(now.getTime() - DAYS * 24 * 60 * 60 * 1000);

            const metaRes = await fetch(`${API_ROOT}/ogcapi/v0/collections/time-series-metadata/items` +
                `?monitoring_location_id=USGS-${SITE_NUMBER}&parameter_code=${PARAMETER_CODE}`);
            const meta = await metaRes.json();
            const ivSeries = meta.features.find(f => f.properties.computation_identifier === 'Instantaneous');
            const dailyMeanSeries = meta.features.find(f =>
                f.properties.computation_period_identifier === 'Daily' && f.properties.computation_identifier === 'Mean');
            if (!ivSeries || !dailyMeanSeries) {
                throw new Error('Site/parameter time series metadata not found');
            }

            const fetchContinuous = async (timeRange) => {
                const url = `${API_ROOT}/ogcapi/v0/collections/continuous/items?limit=50000` +
                    `&properties=time,value&time_series_id=${ivSeries.properties.id}&time=${encodeURIComponent(timeRange)}`;
                const res = await fetch(url);
                const json = await res.json();
                return json.features.map(f => ({ time: new Date(f.properties.time), value: parseFloat(f.properties.value) }));
            };

            const lastYearStart = new Date(start);
            lastYearStart.setFullYear(lastYearStart.getFullYear() - 1);
            const lastYearEnd = new Date(now);
            lastYearEnd.setFullYear(lastYearEnd.getFullYear() - 1);

            const pad = (n) => String(n).padStart(2, '0');
            const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
            const oneYearAgo = new Date(now);
            oneYearAgo.setFullYear(oneYearAgo.getFullYear() - 1);
            const todayMonthDay = `${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;

            const [currentData, lastYearRaw, normalsRes, latestRes, lastYearDayRes, medianTodayRes] = await Promise.all([
                fetchContinuous(`${iso(start)}/${iso(now)}`),
                fetchContinuous(`${iso(lastYearStart)}/${iso(lastYearEnd)}`),
                fetch(`${API_ROOT}/statistics/v0/observationNormals?parent_time_series_id=${dailyMeanSeries.properties.id}&computation_type=median`)
                    .then(r => r.json()),
                fetch(`${API_ROOT}/ogcapi/v0/collections/latest-continuous/items?monitoring_location_id=USGS-${SITE_NUMBER}&parameter_code=${PARAMETER_CODE}&f=json`)
                    .then(r => r.json()),
                fetch(`${API_ROOT}/ogcapi/v0/collections/daily/items?monitoring_location_id=USGS-${SITE_NUMBER}&parameter_code=${PARAMETER_CODE}&time=${ymd(oneYearAgo)}&f=json`)
                    .then(r => r.json()),
                fetch(`${API_ROOT}/statistics/v0/observationNormals?parent_time_series_id=${dailyMeanSeries.properties.id}` +
                    `&computation_type=median&start_date=${todayMonthDay}&end_date=${todayMonthDay}`)
                    .then(r => r.json()),
            ]);

            const setStat = (key, value, unit) => {
                const card = document.querySelector(`.stat-card[data-stat="${key}"]`);
                card.querySelector('.stat-value').textContent = value != null ? `${parseFloat(value).toFixed(2)} ${unit}` : 'N/A';
            };
            const latestProps = latestRes.features[0]?.properties;
            setStat('current', latestProps?.value, latestProps?.unit_of_measure);
            const lastYearProps = lastYearDayRes.features[0]?.properties;
            setStat('lastYear', lastYearProps?.value, lastYearProps?.unit_of_measure);
            const medianToday = medianTodayRes.features[0]?.properties?.data[0]?.values[0];
            setStat('median', medianToday?.value, latestProps?.unit_of_measure);

            // Shift last year's timestamps forward a year so they overlay this year's axis.
            const lastYearData = lastYearRaw.map(({ time, value }) => {
                const shifted = new Date(time);
                shifted.setFullYear(shifted.getFullYear() + 1);
                return { time: shifted, value };
            });

            // Historical median is keyed by day-of-year ("MM-DD"); one point per day in the window.
            const medianByDay = new Map(
                normalsRes.features[0].properties.data[0].values.map(v => [v.time_of_year, parseFloat(v.value)])
            );
            const medianData = [];
            for (let d = new Date(start); d <= now; d.setDate(d.getDate() + 1)) {
                const key = `${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                if (medianByDay.has(key)) {
                    const noon = new Date(d);
                    noon.setHours(12, 0, 0, 0);
                    medianData.push({ time: noon, value: medianByDay.get(key) });
                }
            }

            // Merge the three series into one Dygraph-compatible matrix (one row per unique timestamp).
            const seriesList = [currentData, lastYearData, medianData];
            const allTimes = new Set();
            seriesList.forEach(series => series.forEach(p => allTimes.add(p.time.getTime())));
            const sortedTimes = Array.from(allTimes).sort((a, b) => a - b);
            const lookups = seriesList.map(series => new Map(series.map(p => [p.time.getTime(), p.value])));
            const dygraphData = sortedTimes.map(t => [
                new Date(t),
                ...lookups.map(map => (map.has(t) ? map.get(t) : null)),
            ]);

            // Dygraph paints directly onto a <canvas>, so dark mode needs its own color set
            // here — CSS alone can't reach gridlines, axis lines, or the underlay border.
            const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const chartColors = isDark
                ? { line: '#8899a6', grid: '#333f48', current: '#4da6ff', lastYear: '#9aa7b2', median: '#ff9955' }
                : { line: '#777777', grid: '#e5e5e5', current: '#0868ac', lastYear: '#999999', median: '#e6550d' };

            new Dygraph(document.getElementById('usgsChart'), dygraphData, {
                labels: ['Date', 'Current Live Data', 'Last Year Data', 'Historical Median'],
                title: 'Gage Height Comparison',
                ylabel: 'Gage height, feet',
                labelsUTC: false,
                connectSeparatedPoints: true,
                legend: 'always',
                labelsDiv: document.getElementById('chartLegend'),
                showRangeSelector: true,
                axisLineColor: chartColors.line,
                gridLineColor: chartColors.grid,
                axes: { y: { axisLabelFormatter: n => n.toLocaleString() } },
                underlayCallback: (ctx, area) => {
                    ctx.strokeStyle = chartColors.line;
                    ctx.strokeRect(area.x, area.y, area.w, area.h);
                },
                series: {
                    'Current Live Data': { color: chartColors.current, strokeWidth: 2 },
                    'Last Year Data': { color: chartColors.lastYear, strokePattern: [6, 4] },
                    'Historical Median': { color: chartColors.median, strokePattern: [2, 3] },
                },
            });
        } catch (err) {
            console.error('Failed to load USGS chart data', err);
            document.getElementById('usgsChart').textContent = 'Data Unavailable';
            document.querySelectorAll('.stat-card .stat-value').forEach(el => el.textContent = 'N/A');
        }
    });
</script>

</body>
</html>
